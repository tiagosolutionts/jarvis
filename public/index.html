<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Jarvis" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <title>Jarvis</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="dot" id="statusDot"></span><strong id="brandName">JARVIS</strong><span class="mono muted" id="statusText">offline</span></div>
    <nav class="tabs" role="tablist">
      <button class="tab tab-chat" data-tab="conversa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg><span>Conversa</span></button>
      <button class="tab active" data-tab="vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7l2 2h9v11H3z"/></svg><span>Vault</span></button>
      <button class="tab" data-tab="arsenal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"/></svg><span>Arsenal</span></button>
      <button class="tab" data-tab="tarefas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg><span>Tarefas</span></button>
      <button class="tab" data-tab="memoria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Memória</span></button>
    </nav>
    <div class="top-actions">
      <button class="ghost" id="btnReset" title="Nova conversa" aria-label="Nova conversa"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Nova conversa</span></button>
      <button class="ghost" id="btnConfig" title="Configurações" aria-label="Configurações"><svg class="ico" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="lbl">Configurações</span></button>
    </div>
  </header>

  <main class="grid">
    <aside class="side">
      <section data-panel="vault" class="panel active">
        <div class="side-head">
          <span class="mono label" id="vaultPath">VAULT</span>
          <label class="mono small"><input type="checkbox" id="chkHidden" /> ocultos</label>
          <button class="icon" id="btnRefresh" title="Atualizar">↻</button>
        </div>
        <div id="tree" class="tree"></div>
      </section>
      <section data-panel="arsenal" class="panel"><div id="arsenal"></div></section>
      <section data-panel="tarefas" class="panel"><div id="tarefas"></div></section>
      <section data-panel="memoria" class="panel"><div id="memoria" class="md"></div></section>
    </aside>

    <section class="core">
      <div class="orb-wrap">
        <canvas id="orb" width="520" height="520" aria-hidden="true"></canvas>
        <div class="orb-label mono" id="orbLabel">Diga "Jarvis" ou toque no microfone</div>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <form id="form" class="composer">
        <button type="button" id="btnMic" class="mic" title="Falar (atalho: Ctrl+Espaço)" aria-label="Falar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <input id="input" autocomplete="off" placeholder="Escreva ou use /comando…" />
        <button class="primary" type="submit">Enviar</button>
      </form>
      <div class="hint mono small muted"><label id="wakeWrap"><input type="checkbox" id="chkWake" /> escuta contínua com palavra de ativação</label><label><input type="checkbox" id="chkMute" /> silenciar voz</label></div>
    </section>

    <aside class="preview">
      <div class="side-head">
        <span class="mono label" id="pvTitle">PRÉ-VISUALIZAÇÃO</span>
        <div class="pv-actions">
          <button class="ghost small" id="pvAsk" disabled>Pedir ajuste</button>
          <button class="ghost small" id="pvEdit" disabled>Editar</button>
          <a class="ghost small" id="pvOpen" target="_blank" hidden>Abrir</a>
          <button class="ghost small" id="pvClose" title="Fechar">Fechar</button>
        </div>
      </div>
      <div id="pv" class="pv"><p class="muted empty">Selecione um arquivo do Vault ou peça para o Jarvis abrir algo aqui.</p></div>
    </aside>
  </main>

  <dialog id="dlgConfig">
    <form method="dialog" id="cfgForm" class="cfg">
      <h2>Configurações</h2>
      <fieldset><legend class="mono">Identidade</legend>
        <label>Nome<input name="nome" /></label>
        <label>Como te chamar<input name="tratamento" /></label>
        <label class="wide">Personalidade<textarea name="personalidade" rows="2"></textarea></label>
        <label class="wide">Pasta do Vault (caminho absoluto)<input name="vaultPath" /></label>
      </fieldset>
      <fieldset><legend class="mono">Cérebro</legend>
        <label>Provedor<select name="provedor"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI / compatível</option></select></label>
        <label>Modelo<input name="modelo" placeholder="claude-sonnet-4-5 / gpt-4.1" /></label>
        <label>Chave Anthropic<input name="anthropicKey" type="password" autocomplete="off" /></label>
        <label>Chave OpenAI<input name="openaiKey" type="password" autocomplete="off" /></label>
        <label class="wide">URL base OpenAI-compatível (OpenRouter, Ollama, LM Studio)<input name="openaiBaseUrl" /></label>
      </fieldset>
      <fieldset><legend class="mono">Voz</legend>
        <label>Motor<select name="voz.motor"><option value="navegador">Navegador (grátis)</option><option value="elevenlabs">ElevenLabs</option><option value="openai">OpenAI TTS</option></select></label>
        <label>Voz do navegador<select name="voz.nomeVoz" id="selVoz"></select></label>
        <label>Velocidade<input name="voz.velocidade" type="number" step="0.05" min="0.5" max="2" /></label>
        <label>Tom<input name="voz.tom" type="number" step="0.05" min="0" max="2" /></label>
        <label>Chave ElevenLabs<input name="voz.elevenlabsKey" type="password" autocomplete="off" /></label>
        <label>Voice ID ElevenLabs<input name="voz.elevenlabsVoiceId" /></label>
        <label>Voz OpenAI<select name="voz.openaiVoz"><option>onyx</option><option>alloy</option><option>echo</option><option>fable</option><option>nova</option><option>shimmer</option><option>ash</option><option>sage</option></select></label>
        <button type="button" class="ghost" id="btnTestVoice">Testar voz</button>
      </fieldset>
      <fieldset><legend class="mono">Permissões</legend>
        <label class="wide check"><input type="checkbox" name="permitirComandos" /> Permitir que o Jarvis execute comandos no terminal (scripts, Claude Code, Codex, git)</label>
      </fieldset>
      <div class="cfg-actions"><button value="cancel" class="ghost">Cancelar</button><button id="cfgSave" value="default" class="primary">Salvar</button></div>
    </form>
  </dialog>

  <script>window.__API_BASE__ = '__PORT_3333__';</script>
  <script src="./app.js"></script>
</body>
</html>
